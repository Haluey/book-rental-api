<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Book Rental Management</title>
</head>
<body>
    <header>
        <h1>Book Rental Management</h1>
        <p>도서 대여 현황과 이력을 관리합니다.</p>
    </header>

    <main>
        <section>
            <h2>대여 현황</h2>

            <div class="summary-cards">
                <div class="summary-card">
                    <span>전체 도서</span>
                    <strong id="totalBooks">0</strong>
                </div>

                <div class="summary-card">
                    <span>대여 가능</span>
                    <strong id="availableBooks">0</strong>
                </div>

                <div class="summary-card">
                    <span>대여 중</span>
                    <strong id="activeRentals">0</strong>
                </div>
            </div>
        </section>

        <section>
            <h2>현재 대여 중인 도서</h2>

            <table>
                <thead>
                    <tr>
                        <th>도서명</th>
                        <th>회원명</th>
                        <th>대여일</th>
                        <th>상태</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="activeRentalTableBody">
                    <tr>
                        <td colspan="5" class="empty-message">
                            대여 중인 도서가 없습니다.
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>새 도서 대여</h2>

            <div class="rental-form">
                <label for="memberSelect">회원</label>
                <select id="memberSelect">
                    <option value="">회원을 선택하세요</option>
                </select>

                <label for="bookSelect">도서</label>
                <select id="bookSelect">
                    <option value="">도서를 선택하세요</option>
                </select>

                <button type="button" id="rentButton" class="primary-button">
                    대여하기
                </button>
            </div>
        </section>

        <section>
            <h2>전체 대여 이력</h2>

            <table>
                <thead>
                    <tr>
                        <th>도서명</th>
                        <th>회원명</th>
                        <th>대여일</th>
                        <th>반납일</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody id="rentalHistoryTableBody">
                    <tr>
                        <td colspan="5" class="empty-message">
                            대여 이력이 없습니다.
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

<script src="/js/app.js"></script>

</body>
</html>
